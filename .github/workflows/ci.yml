# CI: brand + hosting hygiene for the audrey-v1 repo.
# - Fails if the ephemeral-registry hostname (ttl.sh) appears anywhere in
#   the repo. That hostname is banned by the Arbor hosting rules.
# - Fails on any ® sign in customer-facing text (™ only until registered).
# - Fails on the retired brand name in customer-facing text.
name: arbor-hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on banned registry hostname
        run: |
          # The banned ephemeral-registry hostname. This is the ONLY file in
          # the repo allowed to contain the literal string.
          BANNED='ttl.sh'
          if grep -rI --exclude-dir=node_modules --exclude-dir=.git --exclude='*.yml' --exclude='*.yaml' "$BANNED" .; then
            echo "ERROR: banned registry hostname found in the repo." >&2
            exit 1
          fi
          echo "OK: no banned registry hostname outside CI config."

      - name: Fail on retired brand name in customer-facing text
        run: |
          if grep -rInE 'AUDE|AUDe|A\.U\.D\.e' --include='*.html' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=.git public/ server.js providers/; then
            echo "ERROR: retired brand name found in customer-facing text." >&2
            exit 1
          fi
          echo "OK: no retired brand name in customer-facing text."

      - name: Fail on registered-mark sign (™ only)
        run: |
          if grep -rIn '®' --include='*.html' --include='*.js' \
              --exclude-dir=node_modules --exclude-dir=.git public/ server.js providers/; then
            echo "ERROR: ® found — use ™ only until a registration issues." >&2
            exit 1
          fi
          echo "OK: no ® sign."
